<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Ivanna ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
      overflow: hidden;
    }

    /* PANTALLA DE BLOQUEO */
    #lockscreen {
      width: 100vw;
      height: 100dvh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;

      background:
        linear-gradient(
          rgba(0,0,0,0.15),
          rgba(0,0,0,0.35)
        ),
        radial-gradient(circle at top, #692d73, #241331 50%, #09060c);
    }

    .lock {
      margin-top: 55px;
      font-size: 25px;
    }

    #date {
      margin-top: 18px;
      font-size: 20px;
      font-weight: 500;
    }

    #time {
      font-size: 82px;
      font-weight: 200;
      letter-spacing: -5px;
      line-height: 1.05;
    }

    .message {
      margin-top: 35px;
      padding: 14px 20px;
      width: 88%;
      max-width: 390px;

      background: rgba(255,255,255,0.14);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);

      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 22px;

      text-align: center;
    }

    .message-title {
      font-weight: 600;
      font-size: 17px;
    }

    .message-text {
      margin-top: 5px;
      opacity: .85;
      font-size: 14px;
    }

    .bottom {
      position: absolute;
      bottom: 28px;
      width: 100%;
      text-align: center;
    }

    .unlock {
      color: white;
      font-size: 16px;
      opacity: .85;
      animation: pulse 1.8s infinite;
    }

    .homebar {
      width: 135px;
      height: 5px;
      background: white;
      border-radius: 10px;
      margin: 18px auto 0;
    }

    @keyframes pulse {
      0%,100% {
        opacity: .45;
        transform: translateY(0);
      }

      50% {
        opacity: 1;
        transform: translateY(-5px);
      }
    }
  </style>
</head>

<body>

  <div id="lockscreen">

    <div class="lock">🔒</div>

    <div id="date">Jueves, 1 de octubre</div>

    <div id="time">20:16</div>

    <div class="message">
      <div class="message-title">
        ❤️ Para Ivanna
      </div>

      <div class="message-text">
        Tienes algo nuevo esperando por ti...
      </div>
    </div>

    <div class="bottom">
      <div class="unlock">
        Toca para desbloquear ↑
      </div>

      <div class="homebar"></div>
    </div>

  </div>

  <script>
    function actualizarHora() {
      const ahora = new Date();

      document.getElementById("time").textContent =
        ahora.toLocaleTimeString("es-MX", {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        });

      document.getElementById("date").textContent =
        ahora.toLocaleDateString("es-MX", {
          weekday: "long",
          day: "numeric",
          month: "long"
        });
    }

    actualizarHora();
    setInterval(actualizarHora, 1000);
  </script>

</body>
</html>
